        </div>
        <img{{ with .avatar }} data-render-resource="{{ . }}"{{ end }} class="mhy-account-avatar">
        <div class="account-info">
          <div class="mhy-account-title">
            {{ .nickname }}
            <img{{ with .level }} data-render-resource="{{ . }}"{{ end }} class="mhy-img-icon account-title">
            {{ if .certified }}<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAQBAMAAAD34QLcAAAAKlBMVEVHcEzmyZbmyZbmyZbmyZbmyZbmyZbmyZbmyZbmyZbmyZbmyZbmyZbmyZYjOgR8AAAADXRSTlMA3US7mWbm50xKTUnks2tyCAAAAIJJREFUCNdj2HYXCWQzZDEggWUMFxgYmB1ATBDJy3AhFqTqKpB/CcwNAUm52oIELwO5DLJ3715kYGAB6QBxhRgYFIHcACgXIssMVKwAlQUCRgWgHFT2rgJDLAOUC5RlVmAQAZkAl2UUYGAIRMgaMzDevQTmIgFehgxkbjvDdGQPngQAQ39Au8pquMcAAAAASUVORK5CYII=" class="mhy-img-icon account-title">{{ end }}
          </div>
          <p class="account-label">{{ .label }}</p>
        </div>
        <div class="mhy-follow-button sm-btn android-margin" id="qrcode">{{ safeHTML .qr }}</div>
        <img class="mhy-logo" data-render-resource="mys-logo">
      </div>
      <div class="mhy-article-page__header">
        <div class="mhy-article-page__title">
          <h1>{{ .subject }}</h1>
        </div>
        <div class="mhy-article-page-info">
          <div class="mhy-article-page-info__from">
            <span>来自版块：</span>
            <a class="mhy-router-link mhy-article-page-info__from-name">{{ .forum }} </a>
          </div>
          <div class="mhy-article-page-info__count">
            <div class="mhy-article-page-info__count-item">
              <i class="mhy-icon iconfont icon-liulanshu"></i> <span>{{ .views }}</span>
            </div>
            <div class="mhy-article-page-info__count-item">
              <i class="mhy-icon iconfont icon-dianzan"></i> <span>{{ .likes }}</span>
            </div>
            <div class="mhy-article-page-info__count-item mhy-clickable">
              <i class="mhy-icon iconfont icon-liuyanshu"></i> <span>{{ .replies }}</span>
            </div>
          </div>
        </div>
        <div class="mhy-article-page-updatetime">
          <span>文章发表：{{ .created }}</span>
        </div>
      </div>
      <div class="mhy-article-page__content">
        <div class="mhy-img-text-article ql-container ql-snow">
          <div class="data_box mhy-img-text-article__content ql-editor">{{ safeHTML .content }}</div>
        </div>
      </div>
      <div class="mhy-article-page__footer">
        <div class="mhy-article-page-bottom">
          <div class="mhy-topic-label-selector">
            {{ range .topics }}
            <div class="mhy-topic-label mhy-topic-label-selector__item">
              <a class="mhy-router-link mhy-topic-label__link"><span>{{ . }}</span></a>
            </div>
            {{ end }}
          </div>
        </div>
      </div>
    </div>
  </div>
  {{ with .render_footer }}<div class="logo">{{ . }}</div>{{ end }}
</div>
</body>
</html>
